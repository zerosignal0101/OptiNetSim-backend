# ----------------------------------------------------------------------------
# 准备参数: 通用训练设置
# ----------------------------------------------------------------------------
algorithm_name: mat                     # 指定多智能体算法名称。可选值包括 ["mat", "mat_dec", "mat_encoder", "mat_decoder", "mat_gru"]。
experiment_name: check                  # 实验的唯一标识符，用于区分不同的实验运行。
seed: 1                                 # NumPy 和 PyTorch 的随机种子，确保实验的可复现性。
cuda: true                              # 是否使用 GPU 进行训练。如果为 true，将使用 GPU；否则使用 CPU。
cuda_deterministic: true                # 是否启用 CUDA 确定性模式，以确保随机种子生效并提高可复现性。如果设为 false，则绕过此功能。
n_training_threads: 1                   # PyTorch 训练所使用的线程数。
n_rollout_threads: 32                   # 用于训练 rollout 的并行环境数量。
n_eval_rollout_threads: 1               # 用于评估 rollout 的并行环境数量。
n_render_rollout_threads: 1             # 用于渲染的并行环境数量。某些环境可能只能设置为 1。
num_env_steps: 10000000                 # 训练的总环境步数 (10e6)。
user_name: xxx                          # [用于 WandB] 指定用户的名称，方便数据收集。
use_wandb: true                         # [用于 WandB] 是否将数据记录到 WandB 服务器。如果为 true，则使用 WandB；否则使用 TensorBoard。

# ----------------------------------------------------------------------------
# 环境参数: 环境特性设置
# ----------------------------------------------------------------------------
env_name: StarCraft2                    # 指定环境的名称。
use_obs_instead_of_state: false         # [仅限部分环境] 是否使用局部观测值拼接作为状态，而非全局状态。
max_agents: 30                          # 环境中最大智能体数量。

# ----------------------------------------------------------------------------
# 回放缓冲区参数: 回放缓冲区的行为设置
# ----------------------------------------------------------------------------
episode_length: 200                     # 回放缓冲区中一个 episode 的最大长度。

# ----------------------------------------------------------------------------
# 网络参数: 智能体神经网络架构和特性设置
# ----------------------------------------------------------------------------
share_policy: true                      # 是否所有智能体共享同一策略网络。如果设为 false，每个智能体将使用独立的策略。
use_centralized_V: true                 # 是否使用集中式训练模式（集中式值函数）。如果为 false，则使用分散式训练模式。
stacked_frames: 1                       # 堆叠在一起的输入帧数。
use_stacked_frames: false               # 是否使用堆叠帧作为输入。
hidden_size: 64                         # 演员/评论家网络隐藏层维度。
layer_N: 2                              # 演员/评论家网络的层数。
use_ReLU: true                          # 是否使用 ReLU 激活函数。如果为 false，则使用 Tanh。
use_popart: false                       # 是否使用 PopArt 对奖励进行归一化。
use_valuenorm: true                     # 是否使用运行均值和标准差归一化奖励。
use_feature_normalization: true         # 是否对输入应用 Layer Normalization 进行特征归一化。
use_orthogonal: true                    # 是否对权重使用正交初始化，偏置使用 0 初始化。如果为 false，则使用 Xavier uniform 初始化。
gain: 0.01                              # 最后一层动作层的增益系数。
use_naive_recurrent_policy: false       # 是否使用朴素的循环策略（使用整个轨迹计算隐藏状态）。
use_recurrent_policy: false             # 是否使用循环策略。如果为 true，则使用。
recurrent_N: 1                          # 循环层的数量。
data_chunk_length: 10                   # 用于训练循环策略的数据块时间长度。

# ----------------------------------------------------------------------------
# 优化器参数: 优化器行为设置
# ----------------------------------------------------------------------------
lr: 0.0005                              # 学习率。
lr_alpha: 0.0003                        # alpha 学习率。
critic_lr: 0.0005                       # 评论家网络的学习率。
opti_eps: 0.00001                       # RMSprop 优化器的 epsilon 参数。
weight_decay: 0.0                       # 权重衰减系数。

# ----------------------------------------------------------------------------
# PPO 参数: PPO 特有设置
# ----------------------------------------------------------------------------
ppo_epoch: 15                           # PPO 训练的 epoch 数量。
use_clipped_value_loss: true            # 是否裁剪值损失。如果为 false，则不裁剪。
clip_param: 0.2                         # PPO 裁剪参数。
num_mini_batch: 1                       # PPO 的 mini-batch 数量。
batch_size: 256                         # 批次大小。
entropy_coef: 0.01                      # 熵项系数。
value_loss_coef: 1.0                    # 值损失系数。
use_max_grad_norm: true                 # 是否使用梯度裁剪（根据最大范数）。如果为 false，则不使用。
max_grad_norm: 10.0                     # 梯度的最大范数值。
use_gae: true                           # 是否使用广义优势估计（GAE）。如果为 false，则不使用 GAE。
gamma: 0.99                             # 奖励的折扣因子。
gae_lambda: 0.95                        # GAE 的 lambda 参数。
use_proper_time_limits: false           # 返回值计算是否考虑时间限制因子。
use_huber_loss: true                    # 是否使用 Huber 损失。如果为 false，则不使用 Huber 损失。
use_value_active_masks: true            # 值损失计算期间是否掩盖无用数据。
use_policy_active_masks: true           # 策略损失计算期间是否掩盖无用数据。
huber_delta: 10.0                       # Huber 损失的 delta 系数。

# ----------------------------------------------------------------------------
# PPG 参数: PPG 特有设置
# ----------------------------------------------------------------------------
aux_epoch: 4                            # 辅助 epoch 的数量。
clone_coef: 0.01                        # 克隆项系数。

# ----------------------------------------------------------------------------
# 运行参数: 训练过程中的全局设置
# ----------------------------------------------------------------------------
use_linear_lr_decay: false              # 是否对学习率应用线性衰减计划。

# ----------------------------------------------------------------------------
# 保存与日志参数: 模型保存和训练日志频率设置
# ----------------------------------------------------------------------------
save_interval: 5000                     # 两次模型保存之间的时间间隔。
log_interval: 5                         # 两次日志打印之间的时间间隔。

# ----------------------------------------------------------------------------
# 评估参数: 训练过程中的评估行为设置
# ----------------------------------------------------------------------------
use_eval: false                         # 是否在训练过程中启动评估。
eval_interval: 25                       # 两次评估进程之间的时间间隔。
eval_episodes: 32                       # 单次评估中运行的 episode 数量。

# ----------------------------------------------------------------------------
# 渲染参数: 环境渲染和视频保存设置
# ----------------------------------------------------------------------------
save_gifs: false                        # 是否保存渲染视频（GIF）。
use_render: false                       # 训练期间是否渲染环境。
render_episodes: 5                      # 渲染给定环境的 episode 数量。
ifi: 0.1                                # 保存视频中每个渲染图像的播放间隔。

# ----------------------------------------------------------------------------
# 预训练参数: 预训练模型路径设置
# ----------------------------------------------------------------------------
model_dir: 'pretrained/1_transformer_5000.pt'                         # 预训练模型的路径。默认值为 null。

# ----------------------------------------------------------------------------
# Transformer / MAT 特定参数
# ----------------------------------------------------------------------------
encode_state: false                     # 是否对全局状态进行编码。
n_block: 1                              # Transformer 块的数量。
n_embd: 64                              # 嵌入维度。
n_head: 1                               # 多头注意力机制的头数。
dec_actor: false                        # 是否使用带有解码器的 Actor。
share_actor: false                      # 是否共享 Actor 网络。

# ----------------------------------------------------------------------------
# 在线多任务参数
# ----------------------------------------------------------------------------
train_maps: null                          # 用作训练环境的地图列表。可以为 null。
eval_maps: null                           # 用作评估环境的地图列表。可以为 null。
